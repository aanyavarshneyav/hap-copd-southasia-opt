[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hap-copd-southasia-opt"
version = "0.1.0"
description = "Forecasting and optimal clean-cooking intervention planning for HAP-attributable COPD burden in South Asia (GBD 2023)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "matplotlib>=3.9,<4.0",
    "numpy>=1.26,<3.0",
    "pandas>=2.2,<3.0",
    "pwlf>=2.2,<3.0",
    "pymoo>=0.6,<0.7",
    "pyperplan>=2.1,<3.0",
    "pyyaml>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
    "scipy>=1.13,<2.0",
    "seaborn>=0.13,<0.14",
    "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
bayesian = [
    "arviz>=0.18",
    "pymc>=5.16",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
